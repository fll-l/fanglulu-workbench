<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no, apple-mobile-web-app-capable=yes, apple-mobile-web-app-status-bar-style=black-translucent, apple-mobile-web-app-title=工作台">
<meta name="theme-color" content="#6c7cf2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="工作台">
<meta name="application-name" content="方璐璐的工作台">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<title>方璐璐的工作台</title>
<style>
:root{
  --accent:#6c7cf2; --accent-light:#eef0ff; --accent-deep:#5a64d8;
  --accent2:#8ea0f3;
  --bg:#f3f4fb; --card:#ffffff; --text:#3a3f58; --sub:#8b91a9;
  --line:#ecedf4;
  --green:#7fd0a0; --green-bg:#e4f6ec;
  --purple:#b493e6; --purple-bg:#ede4fa;
  --pink-deep:#e85a8a; --pink-bg:#ffe3ec;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:"PingFang SC","Microsoft YaHei",sans-serif;}
body{background:var(--bg);color:var(--text);display:flex;min-height:100vh;min-height:100dvh;}
/* ===== 侧边栏 ===== */
.sidebar{width:210px;background:var(--card);border-right:1px solid var(--line);padding:24px 14px;position:fixed;top:0;bottom:0;left:0;overflow-y:auto;}
.logo{font-size:19px;font-weight:700;text-align:center;margin-bottom:26px;background:linear-gradient(120deg,#8a93f7,#6c7cf2);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.5px;}
.logo small{display:block;font-size:11px;color:var(--sub);font-weight:400;margin-top:4px;letter-spacing:2px;background:none;-webkit-background-clip:initial;background-clip:initial;}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:12px;cursor:pointer;color:var(--sub);font-size:14.5px;margin-bottom:6px;transition:.15s;}
.nav-item:hover{background:var(--accent-light);color:var(--accent-deep);}
.nav-item.active{background:var(--accent-light);color:var(--accent-deep);font-weight:600;box-shadow:0 2px 8px rgba(108,124,242,.18);}
.main{margin-left:210px;flex:1;padding:26px 30px;max-width:980px;}
.page{display:none;}
.page.active{display:block;animation:fade .25s;}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.page-title{font-size:21px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;}
.page-date{color:var(--sub);font-size:13.5px;margin:-8px 0 18px;}
/* ===== 卡片 ===== */
.card{background:var(--card);border-radius:16px;padding:18px 20px;margin-bottom:16px;box-shadow:0 2px 10px rgba(60,70,90,.05);}
.card h3{font-size:15px;margin-bottom:12px;color:var(--text);display:flex;justify-content:space-between;align-items:center;}
.muted{color:var(--sub);font-size:12.5px;}
/* ===== 按钮 ===== */
.btn{border:none;border-radius:10px;padding:8px 16px;cursor:pointer;font-size:13.5px;background:var(--accent);color:#fff;transition:.15s;}
.btn:hover{filter:brightness(1.06);}
.btn.ghost{background:var(--accent-light);color:var(--accent-deep);}
.btn.gray{background:#eef0f4;color:#666;}
/* ===== 移动端适配（窄屏：侧边栏→底部 Tab，内容限宽居中） ===== */
.bottom-tab{display:none;}
.install-tip{position:fixed;inset:0;background:rgba(40,44,66,.55);z-index:9998;display:none;align-items:center;justify-content:center;padding:24px;}
.install-card{background:#fff;border-radius:18px;max-width:340px;width:100%;padding:22px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.2);}
.install-title{font-size:18px;font-weight:700;margin-bottom:10px;}
.install-body{font-size:14px;color:var(--text);line-height:1.7;text-align:left;background:var(--bg);border-radius:12px;padding:14px;margin-bottom:16px;}
.install-body b{color:var(--accent-deep);}
.install-actions{display:flex;gap:10px;}
.install-actions .btn{flex:1;}
@media (max-width:820px){
  body{display:block;min-height:100vh;padding-bottom:env(safe-area-inset-bottom);}
  .sidebar{display:none;}
  .bottom-tab{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:1000;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;}
  .bt-item{flex:1;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--sub);padding:5px 0;min-width:0;-webkit-tap-highlight-color:transparent;}
  .bt-item .bt-ico{font-size:20px;line-height:1;}
  .bt-item.active{color:var(--accent-deep);font-weight:600;}
  .main{margin-left:0;padding:calc(16px + env(safe-area-inset-top)) 14px calc(76px + env(safe-area-inset-bottom));max-width:100%;}
  .page-title{font-size:19px;margin-bottom:12px;}
  .page-date{font-size:12.5px;margin:-4px 0 14px;}
  .card{padding:15px 14px;margin-bottom:12px;border-radius:14px;}
  /* 弹窗在手机上更紧凑、不溢出 */
  .modal-box,.confirm-box,.modal{max-width:92vw !important;width:auto !important;padding:18px 18px;}
  /* 日历格在手机上保持可点 */
  .cal-day{font-size:13px;}
  /* 输入框放大，避免 iOS 误触/自动放大 */
  .add-row input,.modal input,.modal select,textarea.note-input{font-size:16px;padding:11px 13px;text-align:center;}
  /* iOS 原生 date/time/select 默认忽略 text-align，需 reset appearance 才能居中 */
  .modal input[type=date],.modal input[type=time],.modal select{-webkit-appearance:none;appearance:none;background:#fafbfd;}
  .modal select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%239aa3b2' stroke-width='3'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 14px center;padding-right:34px;}
  .btn{padding:10px 16px;font-size:15px;}
  .btn.sm{padding:7px 12px;font-size:13.5px;}
  /* 触摸目标放大 */
  .icon-btn{font-size:18px;padding:6px;}
  .todo-item input[type=checkbox]{width:22px;height:22px;}
  /* 网格在窄屏更紧凑 */
  .fit-grid{gap:9px;}
  .fit-btn{padding:14px 8px;font-size:13.5px;}
  .pet-chips{gap:6px;}
  .pet-chips .chip{padding:9px 6px;font-size:12.5px;}
  .cat-grid{gap:8px;}
  .cat-item{padding:11px 4px;font-size:12.5px;}
  .diet-chips{gap:7px;}
  .diet-chips .chip{padding:9px 4px;font-size:12.5px;}
  .task-chips{gap:8px;}
  .chip{padding:9px 14px;font-size:13px;}
  .pet-tab{padding:8px 14px;font-size:13px;}
  .pet-meta .m b{font-size:15px;}
  /* 防止横向溢出 */
  *{max-width:100%;}
  .page,.card,.modal{overflow-wrap:break-word;}
  /* 移动端 toast 提示下移到状态栏/刘海下方，避免与顶部时间重合 */
  .toast-wrap{top:calc(38px + env(safe-area-inset-top));}
}
/* 极窄屏（小手机）底部 Tab 更紧凑、字号更小，避免 8 项挤换行 */
@media (max-width:380px){
  .bt-item{font-size:9.5px;gap:1px;}
  .bt-item .bt-ico{font-size:18px;}
  .main{padding:calc(12px + env(safe-area-inset-top)) 10px calc(72px + env(safe-area-inset-bottom));}
  .card{padding:13px 12px;}
}
.btn.sm{padding:5px 11px;font-size:12.5px;border-radius:8px;}
.btn.round{width:34px;height:34px;border-radius:50%;padding:0;font-size:19px;line-height:1;}
.btn.disabled{opacity:.5;cursor:not-allowed;filter:none;}
.icon-btn{background:none;border:none;cursor:pointer;font-size:15px;color:#c3c9d4;padding:3px;}
.icon-btn:hover{color:var(--accent-deep);}
/* ===== 待办 ===== */
.progress-banner{background:linear-gradient(120deg,#8a93f7,#6c7cf2);color:#fff;border-radius:16px;padding:18px 22px;margin-bottom:16px;}
.progress-banner .big{font-size:22px;font-weight:700;margin-top:4px;}
.pbar{height:8px;background:rgba(255,255,255,.35);border-radius:5px;margin-top:10px;overflow:hidden;}
.pbar>div{height:100%;background:#fff;border-radius:5px;transition:.3s;}
.todo-item{display:flex;align-items:center;gap:12px;padding:12px 6px;border-bottom:1px solid var(--line);}
.todo-item:last-child{border-bottom:none;}
.todo-item input[type=checkbox]{width:19px;height:19px;accent-color:var(--accent);cursor:pointer;flex-shrink:0;}
.todo-item .tname{flex:1;font-size:14.5px;}
.todo-item.done .tname{color:#b8bec9;text-decoration:line-through;}
.tag{font-size:10.5px;background:var(--accent-light);color:var(--accent-deep);padding:2px 7px;border-radius:6px;}
/* ===== 运动健身：可点击任务卡片（每行 3 个） ===== */
.fit-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.fit-task{display:flex;flex-direction:column;gap:8px;padding:14px;border:1px solid var(--line);border-radius:14px;background:#fafbfd;transition:.15s;}
.fit-task:hover{border-color:var(--accent);}
.fit-task-head{display:flex;justify-content:space-between;align-items:center;min-height:18px;}
.fit-btn{flex:none;width:100%;text-align:center;background:var(--accent-light);color:var(--accent-deep);border:none;border-radius:12px;padding:16px 12px;cursor:pointer;font-size:14.5px;transition:.15s;font-weight:500;}
.fit-btn::before{content:"○ ";font-weight:700;opacity:.7;}
.fit-btn:hover{filter:brightness(.97);}
.fit-task.done{background:#f2f4f8;}
.fit-task.done .fit-btn{background:#eef0f4;color:#b8bec9;font-weight:400;text-decoration:line-through;}
.fit-task.done .fit-btn::before{content:"✓ ";color:var(--accent);opacity:1;}
.fit-ts-title{text-align:center;font-size:16px;}
.fit-min{font-size:11px;color:var(--sub);text-align:center;}
.fit-task.done .fit-min{color:#b8bec9;}
.add-row{display:flex;gap:10px;margin-top:14px;}
.add-row input{flex:1;border:1px solid var(--line);border-radius:10px;padding:9px 13px;font-size:13.5px;outline:none;background:#fafbfd;}
.add-row input:focus{border-color:var(--accent);}
/* ===== 日历 ===== */
.calendar{user-select:none;}
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.cal-back{margin-left:auto;}
.cal-head .cal-title{font-weight:600;font-size:15px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;}
.cal-week{font-size:12px;color:var(--sub);padding:6px 0;}
.cal-day{min-height:52px;border-radius:10px;padding:5px 2px 3px;cursor:pointer;font-size:13px;position:relative;border:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:2px;}
.cal-day:hover{background:#f2f4f8;}
.cal-day.disabled{color:#d4d8e0;cursor:not-allowed;background:none!important;}
.cal-day.selected{border-color:var(--accent);background:var(--accent-light);}
.cal-day.is-today .dnum{background:var(--accent);color:#fff;border-radius:50%;width:22px;height:22px;line-height:22px;display:inline-block;}
.cal-day .dnum{width:22px;height:22px;line-height:22px;}
.cal-marks{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;max-width:100%;}
.dot{width:5px;height:5px;border-radius:50%;background:var(--accent);}
.mark-num{font-size:10px;color:var(--accent-deep);background:var(--accent-light);border-radius:6px;padding:0 4px;}
.lh-solid{color:#e23b3b;font-size:11px;}
.lh-line{color:#e85a8a;font-size:11px;}
.bars{display:flex;flex-direction:column;gap:8px;margin-top:4px;}
.bar-row{display:flex;align-items:center;gap:8px;font-size:12px;}
.bar-label{width:44px;color:var(--sub);text-align:right;flex:none;}
.bar-track{flex:1;background:var(--accent-light);border-radius:6px;height:14px;overflow:hidden;}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-deep));border-radius:6px;}
.bar-val{width:40px;color:var(--sub);flex:none;}
.up{color:#e85a8a;font-size:12px;}
.down{color:#3aa876;font-size:12px;}
.cal-day.p-safe{background:var(--green-bg)!important;color:inherit;}
.cal-day.p-danger{background:var(--purple-bg)!important;color:inherit;}
.cal-day.p-period{background:var(--pink-bg)!important;color:var(--pink-deep);}
.cal-day.p-real{background:#ff9bbd!important;color:#fff;}
.cal-day.p-real .dnum{color:#fff;}
.cal-day.p-safe.selected,.cal-day.p-danger.selected,.cal-day.p-period.selected,.cal-day.p-real.selected{border-color:var(--accent-deep);}
.cal-top{font-size:12px;line-height:1;height:13px;color:#fff;display:flex;align-items:center;justify-content:center;gap:3px;}
.pd-start{color:#b3003b;}
.pd-end{color:#7a1f44;}
/* 运动健身日历：日期下方直接显示任务记录 */
#fit-cal .cal-day{min-height:54px;}
#fit-cal .cal-marks{align-self:stretch;flex-direction:column;flex-wrap:nowrap;gap:1px;justify-content:flex-start;align-items:stretch;width:100%;margin-top:2px;}
.fit-mk{font-size:9px;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;color:var(--sub);}
.fit-mk.done{color:#2e9d6b;}
/* 包六日常日历：日期下方直接显示已选任务 */
#pet-cal .cal-day{min-height:54px;}
#pet-cal .cal-marks{align-self:stretch;flex-direction:column;flex-wrap:nowrap;gap:1px;justify-content:flex-start;align-items:stretch;width:100%;margin-top:2px;}
.pet-mk{font-size:9px;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;color:#2e9d6b;}
/* 饮食日历：日期下方直接显示总摄入/总消耗/净热量 */
#diet-cal .cal-day{min-height:54px;}
#diet-cal .cal-marks{align-self:stretch;flex-direction:column;flex-wrap:nowrap;gap:1px;justify-content:flex-start;align-items:stretch;width:100%;margin-top:2px;}
.diet-mk{font-size:9px;line-height:1.4;white-space:normal;word-break:break-word;text-align:center;color:var(--sub);}
.diet-mk:last-child{color:var(--accent-deep);}
.legend{display:flex;gap:16px;margin-top:10px;font-size:12px;color:var(--sub);}
.legend i{display:inline-block;width:11px;height:11px;border-radius:4px;margin-right:4px;vertical-align:-1px;}
.fert-legend{display:flex;gap:16px;margin-top:8px;font-size:12px;color:var(--sub);}
.fert-legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;}
/* ===== 宠物 ===== */
.pet-tabs{display:flex;gap:10px;flex-wrap:wrap;}
.pet-tab{padding:9px 20px;border-radius:12px;background:var(--card);cursor:pointer;font-size:14px;border:2px solid transparent;box-shadow:0 2px 8px rgba(60,70,90,.05);}
.pet-tab.active{border-color:var(--accent);color:var(--accent-deep);font-weight:600;background:var(--accent-light);}
.task-chips{display:flex;gap:10px;flex-wrap:wrap;}
.chip{padding:9px 18px;border-radius:12px;background:var(--accent-light);color:var(--accent-deep);cursor:pointer;font-size:13.5px;border:none;}
.chip:hover{background:var(--accent);color:#fff;}
.pet-avatar{width:58px;height:58px;border-radius:50%;background:var(--accent-light);display:flex;align-items:center;justify-content:center;font-size:30px;overflow:hidden;flex-shrink:0;}
.pet-avatar img{width:100%;height:100%;object-fit:cover;}
.pet-meta{display:flex;margin-top:14px;}
.pet-meta .m{flex:1;text-align:center;}
.pet-meta .m b{display:block;font-size:16px;}
.pet-meta .m span{font-size:12px;color:var(--sub);}
.rec-item{display:flex;justify-content:space-between;align-items:center;padding:9px 4px;border-bottom:1px dashed var(--line);font-size:13.5px;}
.rec-item:last-child{border-bottom:none;}
/* ===== 饮食 ===== */
.stat-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:16px;}
.stat-box{flex:1;min-width:130px;background:var(--card);border-radius:14px;padding:14px 18px;box-shadow:0 2px 10px rgba(60,70,90,.05);}
.stat-box b{font-size:21px;color:var(--accent-deep);}
.stat-box.green b{color:#3aa876;}
.diet-hero{background:var(--card);border-radius:14px;padding:18px 14px;box-shadow:0 2px 10px rgba(60,70,90,.05);margin-bottom:16px;}
.diet-hero .dh-top{display:flex;align-items:center;justify-content:space-around;gap:12px;}
.nutri-row{display:flex;gap:10px;margin-top:16px;padding-top:14px;border-top:1px dashed var(--line);}
.nutri-col{flex:1;text-align:center;}
.nutri-label{font-size:12.5px;color:var(--sub);margin-bottom:7px;}
.nutri-bar{height:8px;border-radius:6px;background:var(--accent-light);overflow:hidden;}
.nutri-fill{height:100%;border-radius:6px;transition:width .3s;}
.nutri-val{font-size:11.5px;color:var(--sub);margin-top:5px;}
.diet-chips{display:flex;flex-wrap:nowrap;gap:10px;}
.diet-chips .chip{flex:1;text-align:center;white-space:nowrap;}
.pet-chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.pet-chips .chip{width:100%;text-align:center;white-space:nowrap;}
.diet-hero .dh-side{text-align:center;min-width:90px;}
.diet-hero .dh-side b{display:block;font-size:20px;margin-top:4px;}
.diet-hero .dh-side span{font-size:12.5px;color:var(--sub);}
.diet-hero .dh-in b{color:var(--accent-deep);}
.diet-hero .dh-out b{color:#3aa876;}
.food-item{display:flex;align-items:center;gap:12px;padding:9px 2px;border-bottom:1px dashed var(--line);font-size:13.5px;}
.food-item:last-child{border-bottom:none;}
.food-img{width:42px;height:42px;border-radius:9px;object-fit:cover;background:#f2f4f8;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;overflow:hidden;}
.food-img img{width:100%;height:100%;object-fit:cover;}
.meal-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:820px){.meal-grid{grid-template-columns:1fr}}
/* 小屏：饮食 hero 三栏堆叠，避免挤压 */
@media(max-width:560px){
  .diet-hero .dh-top{flex-direction:column;gap:14px;}
  .diet-hero .dh-side{min-width:0;width:100%;display:flex;justify-content:space-around;align-items:center;background:var(--bg);border-radius:12px;padding:10px;}
  .diet-hero .dh-side b{margin-top:0;}
  .nutri-row{gap:6px;}
  .money-row .m{min-width:0;flex:1 1 40%;}
  .cat-grid{grid-template-columns:repeat(2,1fr);}
  .stat-row{gap:10px;}
  .stat-box{min-width:0;flex:1 1 45%;}
  .legend,.fert-legend{gap:10px;flex-wrap:wrap;}
}
/* ===== 体重 ===== */
.wprog{margin:18px 0 8px;}
.wprog-bar{height:14px;background:#eef0f4;border-radius:8px;position:relative;overflow:visible;}
.wprog-bar>div{height:100%;background:linear-gradient(90deg,#8a93f7,var(--accent-deep));border-radius:8px;transition:.4s;}
.wprog-pct{position:absolute;top:-26px;transform:translateX(-50%);background:var(--accent-deep);color:#fff;font-size:11.5px;padding:2px 8px;border-radius:8px;white-space:nowrap;}
.wprog-ends{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-top:8px;}
.chart-wrap{cursor:default;}
/* ===== 记账 ===== */
.money-big{font-size:32px;font-weight:700;color:var(--accent-deep);margin:6px 0 12px;}
.money-row{display:flex;gap:12px;flex-wrap:wrap;}
.money-row .m{flex:1;min-width:100px;background:#fafbfd;border-radius:10px;padding:10px 14px;font-size:12.5px;color:var(--sub);}
.money-row .m b{display:block;font-size:16px;color:var(--text);margin-top:3px;}
.bill-item{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line);font-size:13.5px;}
.bill-item:last-child{border-bottom:none;}
.bill-icon{width:38px;height:38px;border-radius:10px;background:var(--accent-light);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
/* 账单按日期分组 */
.day-group{margin-top:14px;}
.day-group:first-child{margin-top:6px;}
.day-head{display:flex;align-items:center;justify-content:space-between;padding:6px 4px;position:sticky;top:0;}
.day-date{font-size:14px;font-weight:600;color:var(--text);}
.day-today{display:inline-block;margin-left:6px;font-size:11px;font-weight:600;color:#fff;background:var(--accent);border-radius:6px;padding:1px 6px;vertical-align:1px;}
.day-net{font-size:13px;font-weight:600;}
.day-body{background:#fafbfd;border-radius:12px;padding:2px 12px;border:1px solid var(--line);}
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0;}
.cat-item{padding:12px 6px;border-radius:12px;background:#fafbfd;border:2px solid transparent;text-align:center;cursor:pointer;font-size:13px;}
.cat-item.active{border-color:var(--accent);background:var(--accent-light);color:var(--accent-deep);}
.type-tabs{display:flex;gap:0;background:#eef0f4;border-radius:10px;padding:4px;margin-bottom:6px;}
.type-tabs div{flex:1;text-align:center;padding:8px;border-radius:8px;cursor:pointer;font-size:14px;}
.type-tabs div.active{background:#fff;color:var(--accent-deep);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.08);}
/* ===== 碎碎念 ===== */
.note-item{padding:13px 4px;border-bottom:1px solid var(--line);}
.note-item:last-child{border-bottom:none;}
.note-item .nd{font-size:12px;color:var(--sub);margin-bottom:5px;display:flex;justify-content:space-between;}
.note-item .nt{font-size:14px;line-height:1.7;white-space:pre-wrap;}
textarea.note-input{width:100%;min-height:110px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;resize:vertical;outline:none;background:#fafbfd;line-height:1.7;}
textarea.note-input:focus{border-color:var(--accent);}
/* ===== 弹窗 ===== */
.modal-mask{position:fixed;inset:0;background:rgba(30,35,45,.45);display:flex;align-items:center;justify-content:center;z-index:99;}
.modal{background:#fff;border-radius:18px;padding:22px 24px;width:420px;max-width:92vw;max-height:88vh;overflow-y:auto;}
.modal h3{font-size:16px;margin-bottom:16px;}
.modal .form-row{margin-bottom:13px;}
.modal label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:5px;}
.modal input,.modal select{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px;outline:none;background:#fafbfd;text-align:center;}
.modal input:focus{border-color:var(--accent);}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;}
/* 计算器 */
.calc-display{background:#f4f5f9;border-radius:10px;padding:14px;text-align:right;font-size:22px;margin-bottom:10px;min-height:54px;word-break:break-all;}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.calc-grid button{padding:13px 0;border:none;border-radius:10px;background:#f4f5f9;font-size:17px;cursor:pointer;}
.calc-grid button.op{background:var(--accent-light);color:var(--accent-deep);}
.calc-grid button.eq{background:var(--accent);color:#fff;grid-column:span 2;}
/* 经期列表 */
.pd-row{display:flex;align-items:center;justify-content:space-between;padding:13px 4px;border-bottom:1px solid var(--line);font-size:14.5px;}
.pd-row:last-child{border-bottom:none;}
.yn{display:flex;gap:8px;}
.yn button{padding:6px 18px;border-radius:9px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-size:13px;}
.yn button.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.empty{text-align:center;color:#c3c9d4;font-size:13px;padding:18px 0;}
.flex-between{display:flex;justify-content:space-between;align-items:center;}
/* ===== Toast 轻提示（替代 alert，沙箱 iframe 内可用） ===== */
.toast-wrap{position:fixed;top:28px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:10px;align-items:center;pointer-events:none;}
.toast{background:rgba(58,63,88,.94);color:#fff;padding:11px 20px;border-radius:12px;font-size:14px;box-shadow:0 8px 24px rgba(58,63,88,.28);animation:toastIn .25s ease;max-width:80vw;}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px);}to{opacity:1;transform:translateY(0);}}
/* ===== 确认弹窗（替代 confirm） ===== */
.confirm-mask{position:fixed;inset:0;background:rgba(40,44,60,.45);z-index:9998;display:flex;align-items:center;justify-content:center;animation:toastIn .2s ease;}
.confirm-box{background:#fff;border-radius:16px;padding:24px 22px;width:300px;max-width:84vw;text-align:center;box-shadow:0 16px 48px rgba(40,44,60,.3);}
.confirm-box p{font-size:15px;color:var(--text);margin-bottom:18px;line-height:1.5;}
.confirm-box .confirm-actions{display:flex;gap:10px;}
.confirm-box .confirm-actions button{flex:1;padding:10px 0;border-radius:10px;border:none;cursor:pointer;font-size:14px;}
.confirm-box .c-yes{background:var(--accent);color:#fff;}
.confirm-box .c-no{background:#eef0f4;color:#666;}
</style>

<script>
/* ================= 通用工具 ================= */
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){localStorage.setItem(k,JSON.stringify(v))}
};
const pad=n=>String(n).padStart(2,"0");
const fmtDate=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const todayStr=()=>fmtDate(new Date());
const nowTime=()=>{const d=new Date();return pad(d.getHours())+":"+pad(d.getMinutes())};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
/* 页面内轻提示：替代 alert，沙箱 iframe 中 alert 会被浏览器静默拦截 */
function toast(msg){
  let wrap=document.querySelector(".toast-wrap");
  if(!wrap){wrap=document.createElement("div");wrap.className="toast-wrap";document.body.appendChild(wrap);}
  const t=document.createElement("div");t.className="toast";t.textContent=msg;
  wrap.appendChild(t);
  setTimeout(()=>{t.style.transition="opacity .3s,transform .3s";t.style.opacity="0";t.style.transform="translateY(-8px)";setTimeout(()=>t.remove(),300);},1900);
}
/* 页面内确认框：替代 confirm，返回 Promise<boolean> */
function confirmModal(msg,noMaskClose){
  return new Promise(res=>{
    const mask=document.createElement("div");mask.className="confirm-mask";
    mask.innerHTML='<div class="confirm-box"><p>'+esc(msg)+'</p><div class="confirm-actions"><button class="c-no">取消</button><button class="c-yes">确定</button></div></div>';
    const close=v=>{mask.remove();res(v);};
    mask.querySelector(".c-no").onclick=()=>close(false);
    mask.querySelector(".c-yes").onclick=()=>close(true);
    if(!noMaskClose)mask.addEventListener("click",e=>{if(e.target===mask)close(false);});
    document.body.appendChild(mask);
  });
}
const cnDate=ds=>{const[y,m,d]=ds.split("-");return y+"年"+(+m)+"月"+(+d)+"日"};
const weekCn=ds=>"星期"+"日一二三四五六"[new Date(ds+"T00:00:00").getDay()];

function openModal(title,bodyHTML,onMount,noMaskClose){
  const root=document.getElementById("modal-root");
  const mask=document.createElement("div");mask.className="modal-mask";
  mask.innerHTML='<div class="modal"><h3>'+esc(title)+'</h3><div class="modal-body">'+bodyHTML+'</div></div>';
  if(!noMaskClose)mask.addEventListener("click",e=>{if(e.target===mask)close()});
  function close(){mask.remove()}
  root.appendChild(mask);
  if(onMount)onMount(mask.querySelector(".modal"),close);
  return close;
}
function readImage(file,cb){
  const r=new FileReader();
  r.onload=()=>{const img=new Image();img.onload=()=>{
    const max=220,sc=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement("canvas");c.width=img.width*sc;c.height=img.height*sc;
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    cb(c.toDataURL("image/jpeg",.75));
  };img.src=r.result};
  r.readAsDataURL(file);
}

/* ============ 通用日历组件 ============ */
function createCalendar(cfg){
  // cfg:{onSelect,getMarks(ds)->html,dayClass(ds)->cls,limitToToday}
  const el=document.createElement("div");el.className="calendar";
  const now=new Date();
  let vy=now.getFullYear(),vm=now.getMonth(),sel=todayStr();
  function render(){
    const first=new Date(vy,vm,1),startDay=first.getDay(),dim=new Date(vy,vm+1,0).getDate();
    const td=todayStr();
    const showBack=(sel!==td)||(vy!==now.getFullYear()||vm!==now.getMonth());
    let h='<div class="cal-head">'
      +'<button class="btn gray sm" data-act="prev">‹</button>'
      +'<span class="cal-title">'+vy+'年'+(vm+1)+'月</span>'
      +'<button class="btn gray sm" data-act="next">›</button>'
      +(showBack?'<button class="btn sm cal-back" data-act="back">回今天</button>':"")
      +'</div><div class="cal-grid">';
    for(const w of["日","一","二","三","四","五","六"])h+='<div class="cal-week">'+w+'</div>';
    for(let i=0;i<startDay;i++)h+='<div></div>';
    for(let d=1;d<=dim;d++){
      const ds=vy+"-"+pad(vm+1)+"-"+pad(d);
      const disabled=cfg.disabled?cfg.disabled(ds):(cfg.limitToToday&&ds>td);
      let cls="cal-day"+(disabled?" disabled":"")+(ds===sel?" selected":"")+(ds===td?" is-today":"");
      if(cfg.dayClass){const c=cfg.dayClass(ds);if(c)cls+=" "+c;}
      const marks=cfg.getMarks?cfg.getMarks(ds):"";
      const top=cfg.getTop?cfg.getTop(ds):"";
      h+='<div class="'+cls+'" data-ds="'+ds+'"'+(disabled?"":' data-click="1"')+'>'+top+'<span class="dnum">'+d+'</span><div class="cal-marks">'+marks+'</div></div>';
    }
    h+='</div>';
    el.innerHTML=h;
    el.querySelector('[data-act=prev]').onclick=()=>{vm--;if(vm<0){vm=11;vy--;}render()};
    el.querySelector('[data-act=next]').onclick=()=>{vm++;if(vm>11){vm=0;vy++;}render()};
    const back=el.querySelector('[data-act=back]');
    if(back)back.onclick=()=>{const n=new Date();vy=n.getFullYear();vm=n.getMonth();sel=todayStr();render();if(cfg.backSelects!==false)cfg.onSelect&&cfg.onSelect(sel)};
    el.querySelectorAll('[data-click]').forEach(c=>c.onclick=()=>{sel=c.dataset.ds;render();cfg.onSelect&&cfg.onSelect(sel)});
    if(cfg.onView)cfg.onView({y:vy,m:vm});
  }
  return{el,render,getSel:()=>sel,getView:()=>({y:vy,m:vm})};
}

/* ============ 每日打卡类页面通用（每日计划 / 运动健身） ============ */
function ensureDayTasks(key,presets,ds){
  const all=store.get(key,{});ds=ds||todayStr();
  if(!all[ds]){all[ds]=presets.map(n=>({id:uid(),name:n,done:false,fixed:true}));store.set(key,all);}
  return all;
}

/* ================= 1. 每日计划 ================= */
const PLAN_KEY="fll_plan",PLAN_PRESETS=["喝水2000ml","减肥运动","包六刷牙","23:30前睡"];
const PLAN_RENAME={"喝水":"喝水2000ml","运动":"减肥运动","早睡":"23:30前睡"}; /* 旧固定任务名→新名 */
function renderPlan(){
  const all=ensureDayTasks(PLAN_KEY,PLAN_PRESETS);
  for(const ds in all){for(const t of all[ds]){if(t.fixed&&PLAN_RENAME[t.name])t.name=PLAN_RENAME[t.name];}store.set(PLAN_KEY,all);}
  const td=todayStr(),tasks=all[td];
  const done=tasks.filter(t=>t.done).length;
  const pct=tasks.length?Math.round(done/tasks.length*100):0;
  const page=document.getElementById("page-plan");
  page.innerHTML='<div class="page-title">📅 每日计划</div><div class="page-date">'+cnDate(td)+' '+weekCn(td)+'</div>'
  +'<div class="progress-banner">今日进度<div class="big">已完成 '+done+'/'+tasks.length+' 项</div><div class="pbar"><div style="width:'+pct+'%"></div></div></div>'
  +'<div class="card"><h3>今日待办</h3>'
  +tasks.map(t=>'<div class="todo-item'+(t.done?" done":"")+'"><input type="checkbox" '+(t.done?"checked":"")+' onchange="App.planToggle(\''+t.id+'\')"><span class="tname">'+esc(t.name)+'</span>'+(t.fixed?'<span class="tag">固定</span>':"")+'<button class="icon-btn" onclick="App.planDel(\''+t.id+'\')">🗑</button></div>').join("")
  +'<div class="add-row"><input id="plan-new" placeholder="添加自定义任务..." onkeydown="if(event.key===\'Enter\')App.planAdd()"><button class="btn" onclick="App.planAdd()">＋ 添加</button></div></div>';
}
const App={};
App.planToggle=id=>{const all=store.get(PLAN_KEY,{});const t=all[todayStr()].find(x=>x.id===id);t.done=!t.done;store.set(PLAN_KEY,all);renderPlan();};
App.planDel=id=>{const all=store.get(PLAN_KEY,{});all[todayStr()]=all[todayStr()].filter(x=>x.id!==id);store.set(PLAN_KEY,all);renderPlan();};
App.planAdd=()=>{const inp=document.getElementById("plan-new");const v=inp.value.trim();if(!v){toast("请输入自定义任务哟！");return;}const all=store.get(PLAN_KEY,{});all[todayStr()].push({id:uid(),name:v,done:false,fixed:false,time:""});store.set(PLAN_KEY,all);renderPlan();};

/* ================= 2. 包六日常 ================= */
const PETS_KEY="fll_pets",PET_ACT_KEY="fll_petActive",PET_REC_KEY="fll_petRecords";
const PET_TASKS=["刷牙","排毛","喂药","零食","罐罐","刷碗","换水","换猫砂"];
let petCal=null,petViewDate=todayStr();
function petAge(bd){
  if(!bd)return"-";
  const b=new Date(bd+"T00:00:00"),n=new Date();
  let y=n.getFullYear()-b.getFullYear(),m=n.getMonth()-b.getMonth();
  if(n.getDate()<b.getDate())m--;
  if(m<0){y--;m+=12;}
  return y>0?y+"岁"+(m>0?m+"个月":""):m+"个月";
}
function getPetRecs(pid,ds){const r=store.get(PET_REC_KEY,{});return(r[pid]&&r[pid][ds])||[];}
function renderPet(){
  const pets=store.get(PETS_KEY,[]);
  let act=store.get(PET_ACT_KEY,null);
  if(pets.length&&!pets.find(p=>p.id===act)){act=pets[0].id;store.set(PET_ACT_KEY,act);}
  const page=document.getElementById("page-pet");
  const td=todayStr();
  let h='<div class="page-title">🐱 包六日常 <button class="btn round" title="添加宠物" onclick="App.petEdit()">＋</button></div>'
   +'<div class="page-date">'+cnDate(td)+' '+weekCn(td)+'</div>';
  if(!pets.length){
    h+='<div class="card"><div class="empty">还没有宠物，点击右上角 ＋ 添加第一只毛孩子吧 🐾</div></div>';
    page.innerHTML=h;return;
  }
  h+='<div class="pet-tabs" style="margin-bottom:16px">'+pets.map(p=>'<div class="pet-tab'+(p.id===act?" active":"")+'" onclick="App.petSwitch(\''+p.id+'\')">'+esc(p.name)+'</div>').join("")+'</div>';
  const pet=pets.find(p=>p.id===act);
  h+='<div class="card"><h3>今日任务打卡</h3><div class="task-chips pet-chips">'+PET_TASKS.map(t=>'<button class="chip" onclick="App.petDoTask(\''+esc(t)+'\')">'+t+'</button>').join("")+'</div></div>';
  h+='<div class="card"><div class="flex-between"><div style="display:flex;gap:14px;align-items:center"><div class="pet-avatar">'+(pet.avatar?'<img src="'+pet.avatar+'">':"🐱")+'</div><div><b style="font-size:17px">'+esc(pet.name)+'</b><div class="muted">'+esc(pet.breed||"未知品种")+'</div></div></div><button class="icon-btn" title="编辑" onclick="App.petEdit(\''+pet.id+'\')">✏️</button></div>'
   +'<div class="pet-meta"><div class="m"><b>'+esc(pet.weight||"-")+' kg</b><span>体重</span></div><div class="m"><b>'+esc(pet.birthday||"-")+'</b><span>生日</span></div><div class="m"><b>'+petAge(pet.birthday)+'</b><span>年龄</span></div></div></div>';
  const recs=getPetRecs(act,td);
  h+='<div class="card" id="pet-today-card"><h3>今日记录</h3>'+(recs.length?recs.map((r,i)=>'<div class="rec-item"><span>✅ '+esc(r.task)+'</span><span class="muted">'+r.time+' <button class="icon-btn" onclick="App.petDelRec('+i+')">🗑</button></span></div>').join(""):'<div class="empty">今天还没有记录哦</div>')+'</div>';
  h+='<div class="card"><h3>打卡日历</h3><div id="pet-cal"></div></div>';
  page.innerHTML=h;
  petCal=createCalendar({limitToToday:true,backSelects:false,
    getMarks:ds=>{
      const r=getPetRecs(act,ds);if(!r.length)return"";
      return r.map(x=>{let nm=x.task;if(nm.length>5)nm=nm.slice(0,5)+'…';return '<span class="pet-mk">✓'+esc(nm)+'</span>';}).join("");
    },
    onSelect:ds=>{petViewDate=ds;openPetDayModal(act,ds);}
  });
  document.getElementById("pet-cal").appendChild(petCal.el);petCal.render();
}
let petDayBody=null;
function refreshPetToday(){
  const act=store.get(PET_ACT_KEY,null);if(!act)return;
  const box=document.getElementById("pet-today-card");if(!box)return;
  const recs=getPetRecs(act,todayStr());
  box.innerHTML='<h3>今日记录</h3>'+(recs.length?recs.map((r,i)=>'<div class="rec-item"><span>✅ '+esc(r.task)+'</span><span class="muted">'+r.time+' <button class="icon-btn" onclick="App.petDelRec('+i+')">🗑</button></span></div>').join(""):'<div class="empty">今天还没有记录哦</div>');
}
function openPetDayModal(pid,ds){
  const td=todayStr();petDayBody=null;
  openModal(cnDate(ds)+(ds===td?" （今日）":"")+" 的记录",
    '<div id="pet-day-body"></div>',
    (m,close)=>{petDayBody=m.querySelector("#pet-day-body");renderPetDay(pid,ds);});
}
function renderPetDay(pid,ds){
  const box=petDayBody;if(!box)return;
  const r=getPetRecs(pid,ds);
  let h='<div class="form-row"><label>记录时间</label><input type="time" id="pet-rec-tm" value="'+nowTime()+'"></div>';
  h+='<div class="muted" style="margin-bottom:8px">点击任务即添加，点击 🗑 删除</div>';
  h+= r.length?r.map((x,i)=>'<div class="rec-item"><span>✅ '+esc(x.task)+'</span><span class="muted">'+x.time+' <button class="icon-btn" onclick="App.petDayDel(\''+pid+'\',\''+ds+'\','+i+')">🗑</button></span></div>').join(""):'<div class="empty">当日无记录</div>';

  const all=store.get(FIT_KEY,{});let migrated=false;

const DIET_KEY="fll_diet";
const DIET_BUDGET=1208; /* 每日推荐热量预算 kcal */
const DIET_CARB=169,DIET_PRO=45,DIET_FAT=39; /* 每日营养素推荐摄入克数 */
/* 常见食物每100g营养 [碳水,蛋白,脂肪 克, 热量kcal]，按名称关键词匹配 */
const NUTRI_DB={
  "米饭":[25.9,2.6,0.3,116],"大米":[77,7,0.7,346],"粥":[9,1,0.1,46],"面条":[25,4,0.5,110],
  "馒头":[47,7,1.1,221],"面包":[49,9,3.2,265],"吐司":[49,9,3.2,265],
  "鸡蛋":[2.8,13,9,144],"蛋白":[0.7,11,0.2,52],"蛋黄":[3.1,16,27,322],
  "鸡胸":[0,24,2,118],"鸡肉":[0,19,9,167],"牛肉":[0,20,15,250],"牛排":[0,26,15,250],
  "猪肉":[1,20,28,395],"瘦肉":[1,21,7,143],"排骨":[0,17,23,278],
  "鱼":[0,18,5,113],"虾":[0.2,18,1,85],"三文鱼":[0,20,13,208],
  "牛奶":[5,3,3.2,54],"酸奶":[9,3.2,2.7,72],"豆浆":[1.1,3,1.6,31],
  "苹果":[14,0.3,0.2,52],"香蕉":[23,1.1,0.3,89],"橙子":[12,0.8,0.2,47],"葡萄":[18,0.7,0.2,69],"西瓜":[8,0.6,0.2,30],
  "西兰花":[7,3,0.4,34],"西红柿":[4,0.9,0.2,18],"番茄":[4,0.9,0.2,18],"黄瓜":[3,0.7,0.1,15],"土豆":[17,2,0.1,77],"红薯":[20,1.4,0.2,86],"玉米":[22,4,1.2,112],
  "豆腐":[3,8,4,76],"豆腐干":[5,15,4,140],
  "燕麦":[66,15,7,367],"麦片":[66,15,7,367],"坚果":[20,15,50,580],"花生":[16,26,49,567],
  "巧克力":[51,5,31,546],"饼干":[70,6,20,480],"蛋糕":[50,5,20,380]
};
function estimateNutri(name,weight){
  const w=Math.max(0,+weight||0)/100;
  if(name){
    const n=name.replace(/\s/g,"");
    for(const k in NUTRI_DB){if(n.indexOf(k)>=0){const d=NUTRI_DB[k];
      return{carb:Math.round(d[0]*w*10)/10,pro:Math.round(d[1]*w*10)/10,fat:Math.round(d[2]*w*10)/10,kcal:Math.round(d[3]*w)};}}
  }
  /* 未匹配：按默认热量密度 150kcal/100g + 碳水55%/蛋白20%/脂肪25% 估算 */
  const k=Math.round(150*w);
  return{carb:Math.round(k*0.55/4*10)/10,pro:Math.round(k*0.20/4*10)/10,fat:Math.round(k*0.25/9*10)/10,kcal:k};
}
/* 常见运动每分钟消耗热量（kcal/分钟，按约 50kg 体重估算），按名称关键词匹配 */
/* 各项运动的代谢当量 MET（标准健身/医学参考值），key 为名称关键词 */
const EX_BURN_DB={
  "跑步":9.8,"慢跑":7.0,"跳绳":11.8,"爬坡":6.0,"快走":5.0,"走路":3.5,"骑车":6.8,"自行车":6.8,
  "游泳":8.0,"瑜伽":2.5,"平板":3.5,"力量":5.0,"举重":6.0,"健身":7.3,"舞蹈":5.5,"球":7.3,
  "甩锅":8.0,"转背":2.5,"死虫":3.0,"拉伸":2.3,"太极":3.0,"波比":10.0,"开合":8.0,
  "椭圆":5.0,"划船":7.0,"登山":8.0,"深蹲":5.0,"臀桥":3.0,"卷腹":3.5,"手臂":3.0,"大腿":3.5
};
function estimateBurn(name,minutes){
  const min=Math.max(0,+minutes||0);
  const lw=latestWeight();const bw=lw?Math.round(lw.val):50;
  const n=name?name.replace(/\s/g,""):"";let met=4.5; /* 默认中低强度 MET */
  const keys=Object.keys(EX_BURN_DB).sort((a,b)=>b.length-a.length); /* 优先匹配更长关键词 */
  for(const k of keys){if(n.indexOf(k)>=0){met=EX_BURN_DB[k];break;}}
  const actMet=Math.max(0,met-1); /* 活动代谢当量：扣减 1 MET 静息消耗，得运动额外消耗 */
  const kc=Math.round(0.0175*actMet*bw*min); /* 运动额外消耗：0.0175 × (MET-1) × 体重 × 分钟 */
  const per=Math.round(0.0175*actMet*bw*100)/100; /* 当前体重下每分钟实际运动消耗 */
  return{kcal:kc,per,min};
}
/* 取一条运动记录的消耗：有运动时间则按新公式实时算（防旧数据脏值），否则回退存储值 */
function exKcal(e){return e&&e.min!=null?estimateBurn(e.name,e.min).kcal:(+e.kcal||0);}
/* 顶部概览卡：左摄入 / 中圆环(还可以吃) / 右消耗；还可以吃=预算+消耗*0.9-摄入 */
function dietHeroHTML(intake,burn,nut){
  const total=DIET_BUDGET+burn*0.9;
  const left=Math.round((total-intake)*10)/10;
  const pct=total>0?Math.max(0,Math.min(1,left/total)):0;
  const R=62,C=2*Math.PI*R;
  const col=left<0?"#e85a8a":"var(--accent)";
  const bar=(cur,tar,c)=>{
    const p=tar>0?Math.max(0,cur/tar):0;
    const over=cur>tar;
    const bc=over?"#e85a8a":c;
    return '<div class="nutri-col"><div class="nutri-label">'+(c==="#f0a830"?"碳水化合物":c==="#9b59b6"?"蛋白质":"脂肪")+'</div>'
      +'<div class="nutri-bar"><div class="nutri-fill" style="width:'+(p*100/9).toFixed(1)+'%;background:'+bc+'"></div></div>'
      +'<div class="nutri-val"'+((over)?' style="color:#e85a8a"':'')+'>'+Math.round(cur)+'/'+tar+'克</div></div>';
  };
  return '<div class="diet-hero">'
   +'<div class="dh-top">'
   +'<div class="dh-side dh-in"><span>饮食摄入</span><b>'+intake+'</b><span>千卡</span></div>'
   +'<svg width="150" height="150" viewBox="0 0 150 150">'
   +'<circle cx="75" cy="75" r="'+R+'" fill="none" stroke="var(--accent-light)" stroke-width="10"/>'
   +'<circle cx="75" cy="75" r="'+R+'" fill="none" stroke="'+col+'" stroke-width="10" stroke-linecap="round" stroke-dasharray="'+(C*pct).toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(-90 75 75)"/>'
   +'<text x="75" y="60" text-anchor="middle" font-size="12" fill="var(--sub)">还可以吃（千卡）</text>'
   +'<text x="75" y="86" text-anchor="middle" font-size="24" font-weight="700" fill="'+(left<0?"#e85a8a":"var(--accent-deep)")+'">'+left+'</text>'
   +'<text x="75" y="106" text-anchor="middle" font-size="11" fill="var(--sub)">推荐预算 '+DIET_BUDGET+'</text>'
   +'</svg>'
   +'<div class="dh-side dh-out"><span>运动消耗</span><b>'+burn+'</b><span>千卡</span></div>'
   +'</div>'
   +'<div class="nutri-row">'+bar(nut.carb,DIET_CARB,"#f0a830")+bar(nut.pro,DIET_PRO,"#9b59b6")+bar(nut.fat,DIET_FAT,"#4db6ac")+'</div>'
   +'</div>';
}
const MEALS=[["breakfast","🌅 早餐"],["lunch","🌞 午餐"],["dinner","🌙 晚餐"],["snack","🍪 加餐"]];
let dietCal=null,dietDayBody=null,dietDayDs=null;
function getDietDay(ds){
  const all=store.get(DIET_KEY,{});
  return all[ds]||{meals:{breakfast:[],lunch:[],dinner:[],snack:[]},exercises:[]};
}
function saveDietDay(ds,day){const all=store.get(DIET_KEY,{});all[ds]=day;store.set(DIET_KEY,all);}
function mealTotal(list){return list.reduce((s,f)=>s+(+f.kcal||0),0);}
function nutriTotal(day){const t={carb:0,pro:0,fat:0};for(const k in(day.meals||{}))for(const f of(day.meals[k]||[])){t.carb+=(+f.carb||0);t.pro+=(+f.pro||0);t.fat+=(+f.fat||0);}return t;}
function renderDiet(){
  const td=todayStr(),day=getDietDay(td);
  const intake=MEALS.reduce((s,[k])=>s+mealTotal(day.meals[k]),0);
  const burn=day.exercises.reduce((s,e)=>s+exKcal(e),0);
  const nut=nutriTotal(day);
  const page=document.getElementById("page-diet");
  let h='<div class="page-title">🍱 饮食热量</div><div class="page-date">'+cnDate(td)+' '+weekCn(td)+'</div>'
  +dietHeroHTML(intake,burn,nut)
  +'<div class="card"><div class="task-chips diet-chips">'+MEALS.map(([k,n])=>'<button class="chip" onclick="App.foodEdit(\''+k+'\')">＋ '+n.split(" ")[1]+'</button>').join("")+'<button class="chip" style="background:#e4f6ec;color:#3aa876" onclick="App.exEdit()">＋ 运动</button></div></div>'
  +'<div class="meal-grid">';
  for(const[k,n]of MEALS){
    const list=day.meals[k];
    h+='<div class="card" style="margin-bottom:0"><h3>'+n+'<span class="muted">'+mealTotal(list)+' kcal</span></h3>'
    +(list.length?list.map(f=>'<div class="food-item"><div class="food-img">'+(f.img?'<img src="'+f.img+'">':"🍽")+'</div><div style="flex:1"><div>'+esc(f.name)+'</div><div class="muted">'+esc(f.weight||"-")+' g · '+(+f.kcal||0)+' kcal · 碳'+Math.round(+f.carb||0)+' 蛋'+Math.round(+f.pro||0)+' 脂'+Math.round(+f.fat||0)+'</div></div><button class="icon-btn" onclick="App.foodEdit(\''+k+'\',\''+f.id+'\')">✏️</button><button class="icon-btn" onclick="App.foodDel(\''+k+'\',\''+f.id+'\')">🗑</button></div>').join(""):'<div class="empty">暂无记录</div>')
    +'</div>';
  }
  h+='</div><div class="card" style="margin-top:16px"><h3>🏃 运动记录<span class="muted">总消耗 '+burn+' kcal</span></h3>'
  +(day.exercises.length?day.exercises.map(e=>'<div class="rec-item"><span>'+esc(e.name)+'</span><span class="muted">'+(+e.min||0)+' 分钟 · '+exKcal(e)+' kcal · '+e.time+' <button class="icon-btn" onclick="App.exEdit(null,\''+e.id+'\')">✏️</button><button class="icon-btn" onclick="App.exDel(\''+e.id+'\')">🗑</button></span></div>').join(""):'<div class="empty">今天还没有运动记录</div>')+'</div>'
  +'<div class="card"><h3>饮食日历</h3><div id="diet-cal"></div></div>';
  page.innerHTML=h;
  dietCal=createCalendar({limitToToday:true,backSelects:false,
    getMarks:ds=>{
      const d=store.get(DIET_KEY,{})[ds];if(!d)return"";
      const intake=MEALS.reduce((s,[k])=>s+mealTotal(d.meals[k]||[]),0);
      const burn=(d.exercises||[]).reduce((s,e)=>s+exKcal(e),0);
      if(!intake&&!burn)return"";
      return '<span class="diet-mk">总摄入：'+intake+'kcal</span><span class="diet-mk">总消耗：'+burn+'kcal</span><span class="diet-mk">净热量：'+(intake-burn)+'kcal</span>';
    },
    onSelect:ds=>openDietDayModal(ds)
  });
  document.getElementById("diet-cal").appendChild(dietCal.el);dietCal.render();
}
function openDietDayModal(ds){
  const td=todayStr();dietDayBody=null;dietDayDs=ds;
  openModal(cnDate(ds)+(ds===td?" （今日）":"")+" 的饮食记录",
    '<div id="diet-day-body"></div>',
    (m,close)=>{dietDayBody=m.querySelector("#diet-day-body");renderDietDay(ds);});
}
function renderDietDay(ds){
  const box=dietDayBody;if(!box)return;
  const d=getDietDay(ds);
  let h='<div class="muted" style="margin-bottom:8px">点击「＋」添加，点击 🗑 删除</div>';
  let any=false;
  for(const[k,n]of MEALS){
    const list=d.meals[k]||[];
    if(list.length){any=true;
      h+='<div class="rec-item"><span>'+n+'</span></div>';
      h+=list.map(f=>'<div class="rec-item" style="padding-left:14px"><span>'+esc(f.name)+' · '+(+f.kcal||0)+' kcal</span><span class="muted"><button class="icon-btn" onclick="App.foodDel(\''+k+'\',\''+f.id+'\',\''+ds+'\')">🗑</button></span></div>').join("");
    }
  }
  const ex=d.exercises||[];
  if(ex.length){any=true;
    h+='<div class="rec-item"><span>🏃 运动</span></div>';
    h+=ex.map(e=>'<div class="rec-item" style="padding-left:14px"><span>'+esc(e.name)+' · '+(+e.min||0)+' 分钟 · '+exKcal(e)+' kcal</span><span class="muted"><button class="icon-btn" onclick="App.exEdit(\''+ds+'\',\''+e.id+'\')">✏️</button><button class="icon-btn" onclick="App.exDel(\''+e.id+'\',\''+ds+'\')">🗑</button></span></div>').join("");
  }
  if(!any)h+='<div class="empty">当日无记录</div>';
  h+='<div class="task-chips" style="margin-top:12px">'+MEALS.map(([k,n])=>'<button class="chip" onclick="App.foodEdit(\''+k+'\',null,\''+ds+'\')">＋ '+n.split(" ")[1]+'</button>').join("")+'<button class="chip" style="background:#e4f6ec;color:#3aa876" onclick="App.exEdit(\''+ds+'\')">＋ 运动</button></div>';
  box.innerHTML=h;
}
function refreshDietDayIfOpen(ds){
  if(dietDayBody&&dietDayDs===ds)renderDietDay(ds);
}
App.foodEdit=(meal,fid,ds)=>{
  ds=ds||todayStr();const day=getDietDay(ds);
  const f=fid?day.meals[meal].find(x=>x.id===fid):{name:"",weight:"",kcal:"",img:""};
  let img=f.img||"";

    +'<div class="modal-actions"><button class="btn ghost" id="fm-cancel">取消</button><button class="btn" id="fm-save">保存</button></div>',
    (m,close)=>{
      m.querySelector("#fm-img").onclick=()=>m.querySelector("#fm-file").click();
      m.querySelector("#fm-file").onchange=e=>{if(e.target.files[0])readImage(e.target.files[0],url=>{img=url;m.querySelector("#fm-img").innerHTML='<img src="'+url+'">';});};

        const wt=m.querySelector("#fm-wt").value;

        else day.meals[meal].push(Object.assign({id:uid()},data));
        saveDietDay(ds,day);close();if(ds===todayStr())renderDiet();else dietCal.render();refreshDietDayIfOpen(ds);
      };
    },true);
};
App.foodDel=(meal,fid,ds)=>{ds=ds||todayStr();const day=getDietDay(ds);day.meals[meal]=day.meals[meal].filter(x=>x.id!==fid);saveDietDay(ds,day);if(ds===todayStr())renderDiet();else dietCal.render();refreshDietDayIfOpen(ds);};

App.exDel=(id,ds)=>{ds=ds||todayStr();const day=getDietDay(ds);day.exercises=day.exercises.filter(x=>x.id!==id);saveDietDay(ds,day);if(ds===todayStr())renderDiet();else dietCal.render();refreshDietDayIfOpen(ds);};

/* ================= 5. 体重管理 ================= */
const WT_KEY="fll_weights";
const WT_CFG={initWeight:152,initDate:"2026-08-01",targetWeight:100,targetDate:"2026-12-31"};
function latestWeight(){
  const w=store.get(WT_KEY,{});const ds=Object.keys(w).sort();
  return ds.length?{date:ds[ds.length-1],val:w[ds[ds.length-1]]}:null;
}
function weightChartSVG(width,height){
  const w=store.get(WT_KEY,{});const ds=Object.keys(w).sort();
  if(ds.length<1)return'<div class="empty">还没有体重记录，点右上角 ＋ 记录今天的体重吧</div>';
  const vals=ds.map(d=>+w[d]);
  const min=Math.min(...vals)-1,max=Math.max(...vals)+1;
  const px=i=>ds.length===1?width/2:40+(width-60)*i/(ds.length-1);
  const py=v=>15+(height-50)*(1-(v-min)/(max-min||1));
  let svg='<svg viewBox="0 0 '+width+' '+height+'" width="100%" style="display:block">';
  for(let g=0;g<=3;g++){const y=15+(height-50)*g/3;svg+='<line x1="40" y1="'+y+'" x2="'+(width-20)+'" y2="'+y+'" stroke="#eef0f4"/><text x="34" y="'+(y+4)+'" font-size="10" fill="#8b93a1" text-anchor="end">'+(max-(max-min)*g/3).toFixed(1)+'</text>';}
  if(ds.length>1){
    svg+='<polyline fill="none" stroke="#5a64d8" stroke-width="2.5" stroke-linejoin="round" points="'+ds.map((d,i)=>px(i)+","+py(+w[d])).join(" ")+'"/>';
  }
  ds.forEach((d,i)=>{
    svg+='<circle cx="'+px(i)+'" cy="'+py(+w[d])+'" r="4" fill="#fff" stroke="#5a64d8" stroke-width="2.5"/>'
    +'<text x="'+px(i)+'" y="'+(py(+w[d])-9)+'" font-size="10" fill="#5a64d8" text-anchor="middle">'+w[d]+'</text>';
    const step=Math.ceil(ds.length/8);
    if(i%step===0||i===ds.length-1)svg+='<text x="'+px(i)+'" y="'+(height-8)+'" font-size="9.5" fill="#8b93a1" text-anchor="middle">'+d.slice(5)+'</text>';
  });
  return svg+'</svg>';
}
function renderWeight(){
  const w=store.get(WT_KEY,{});const td=todayStr();
  const todayW=w[td];
  const cur=todayW!=null?todayW:(latestWeight()?latestWeight().val:WT_CFG.initWeight);
  const total=WT_CFG.initWeight-WT_CFG.targetWeight;
  let pct=Math.round((WT_CFG.initWeight-cur)/total*100);
  pct=Math.max(0,Math.min(100,pct));
  const page=document.getElementById("page-weight");
  page.innerHTML='<div class="page-title">⚖️ 体重管理 <button class="btn round" title="添加今日体重" onclick="App.wtEdit()">＋</button></div><div class="page-date">'+cnDate(td)+' '+weekCn(td)+'</div>'
  +'<div class="card"><div class="flex-between"><div><div class="muted">今日体重（斤）</div><div style="font-size:36px;font-weight:700;color:var(--accent-deep);margin-top:4px">'+(todayW!=null?todayW:"--")+'</div>'+(todayW==null?'<div class="muted">今天还没记录</div>':"")+'</div><button class="btn ghost'+(todayW==null?' disabled':'')+'" onclick="'+(todayW==null?'App.wtEditTip()':'App.wtEdit()')+'">✏️ 编辑</button></div></div>'
  +'<div class="card"><h3>减重进度</h3><div class="wprog"><div class="wprog-bar"><div style="width:'+pct+'%"></div><span class="wprog-pct" style="left:'+Math.max(6,Math.min(94,pct))+'%">'+pct+'%</span></div>'
  +'<div class="wprog-ends"><span>初始 '+WT_CFG.initWeight+'<br>'+WT_CFG.initDate.replace(/-/g,".")+'</span><span style="text-align:right">目标 '+WT_CFG.targetWeight+'<br>'+WT_CFG.targetDate.replace(/-/g,".")+'</span></div></div>'
  +'<div class="muted">当前体重 '+cur+'，距离目标还差 '+Math.max(0,(cur-WT_CFG.targetWeight)).toFixed(1)+' 斤，加油！💪</div></div>'
  +'<div class="card"><h3>体重变化趋势</h3><div class="chart-wrap">'+weightChartSVG(640,230)+'</div></div>';
}
App.wtEditTip=()=>{toast("请先添加今日体重哟！");};

/* ================= 6. 经期管理 ================= */
const PD_KEY="fll_period";
let pdCal=null,pdSel=todayStr();
function getPD(){return store.get(PD_KEY,{periods:[],love:{}});}
const LOVE_MEASURES=["避孕套","无措施","体外","其他"];
function loveHeart(measure){return measure==="无措施"?'<span class="lh-solid">♥</span>':'<span class="lh-line">♡</span>';}
function loveMeasureOptions(sel){return LOVE_MEASURES.map(m=>'<option'+(m===sel?' selected':'')+'>'+m+'</option>').join("");}
function pdCycleData(){
  const P=getPD();
  const ps=P.periods.map(p=>p.start).sort();
  const cyc=[];
  for(let i=1;i<ps.length;i++){
    const len=Math.round((new Date(ps[i]+"T00:00:00")-new Date(ps[i-1]+"T00:00:00"))/864e5);
    cyc.push({start:ps[i-1],len});
  }
  return cyc;
}
function pdCycleCardHTML(){
  const cyc=pdCycleData();
  if(cyc.length<1)return '<div class="card" id="pd-cycle-card"><h3>📊 周期变化</h3><div class="muted">记录至少 2 次经期后，才能计算周期变化</div></div>';
  const last=cyc[cyc.length-1];
  const prev=cyc.length>=2?cyc[cyc.length-2]:null;
  const diff=prev?last.len-prev.len:null;
  const last3=cyc.slice(-3).reverse();
  const maxLen=Math.max.apply(null,last3.map(c=>c.len).concat(1));
  const bars=last3.map(c=>{
    const w=Math.max(10,Math.round(c.len/maxLen*100));
    return '<div class="bar-row"><span class="bar-label">'+c.start.slice(5)+'</span><div class="bar-track"><div class="bar-fill" style="width:'+w+'%"></div></div><span class="bar-val">'+c.len+'天</span></div>';
  }).join("");
  const diffHTML=diff==null?'':(diff>0?' <span class="up">▲ 比上一周期多 '+diff+' 天</span>':diff<0?' <span class="down">▼ 比上一周期少 '+(-diff)+' 天</span>':' <span class="muted">与上一周期相同</span>');
  return '<div class="card" id="pd-cycle-card"><h3>📊 周期变化</h3>'
    +'<div style="font-size:14px;line-height:1.95">最近周期起始：<b>'+cnDate(last.start)+' '+weekCn(last.start)+'</b></div>'
    +'<div style="font-size:14px;line-height:1.95">周期天数：<b>'+last.len+'</b> 天'+diffHTML+'</div>'
  +'<div class="bars">'+bars+'</div>'
  +'</div>';
}
function refreshCycleCard(){const el=document.getElementById("pd-cycle-card");if(el)el.outerHTML=pdCycleCardHTML();}
function pdFertCardHTML(){
  const P=getPD();
  if(!P.periods.length)return '<div class="card" id="pd-fert-card"><h3>🤰 怀孕几率</h3><div class="muted">记录经期后可查看怀孕几率曲线</div></div>';
  const starts=P.periods.map(p=>p.start).sort();
  const last=starts[starts.length-1];
  const lastD=new Date(last+"T00:00:00");
  const tdD=new Date(todayStr()+"T00:00:00");
  let diff=Math.round((tdD-lastD)/864e5);
  const k=diff<0?0:Math.floor(diff/28);
  const cycStartD=new Date(lastD.getTime()+k*28*864e5);
  const lp=P.periods.find(p=>p.start===last);
  const L=(lp&&lp.end)?(Math.round((new Date(lp.end+"T00:00:00")-new Date(lp.start+"T00:00:00"))/864e5)+1):5;
  // 怀孕几率：根据经期记录估算——经期内为低(20%)；排卵日(周期第14天)为峰值(60%)；黄体期回落、卵泡期上升
  function fertProbAtDate(dStr){
    if(pdInPeriod(dStr))return 20;
    const dD=new Date(dStr+"T00:00:00");
    const ovD=new Date(cycStartD.getTime()+14*864e5);
    const dOv=Math.round((dD-ovD)/864e5);
    if(dOv>=0){const f=Math.min(1,dOv/14);return Math.round((60-f*40)*10)/10;}
    const dStart=Math.round((dD-cycStartD)/864e5);
    if(dStart<L)return 20;
    const f=(dStart-L)/Math.max(1,14-L);
    return Math.round(Math.max(20,Math.min(60,20+f*40))*10)/10;
  }
  const N=28,pts=[];
  for(let i=0;i<N;i++){const d=new Date(cycStartD.getTime()+i*864e5);pts.push({i,ds:fmtDate(d),p:fertProbAtDate(fmtDate(d))});}
  const todayIdx=Math.round((tdD-cycStartD)/864e5);
  const todayP=(todayIdx>=0&&todayIdx<N)?fertProbAtDate(todayStr()):null;
  const W=560,H=240,left=40,right=14,top=22,bottom=30;
  const pw=W-left-right,ph=H-top-bottom,maxY=66;
  const X=i=>left+(i/(N-1))*pw;
  const Y=p=>top+(1-p/maxY)*ph;
  let grid="";
  [20,40,60].forEach(p=>{grid+='<line x1="'+left+'" y1="'+Y(p)+'" x2="'+(left+pw)+'" y2="'+Y(p)+'" stroke="#eceef5"/><text x="'+(left-6)+'" y="'+(Y(p)+4)+'" font-size="10" fill="#9aa0b4" text-anchor="end">'+p+'%</text>';});
  let xlab="";
  for(let i=0;i<N;i+=3){const d=new Date(cycStartD.getTime()+i*864e5);const mm=('0'+(d.getMonth()+1)).slice(-2),dd=('0'+d.getDate()).slice(-2);xlab+='<text x="'+X(i)+'" y="'+(H-bottom+16)+'" font-size="10" fill="#9aa0b4" text-anchor="middle">'+mm+'-'+dd+'</text>';}
  // 分段着色：月经期(粉)/卵泡期·黄体期(青)/排卵期(紫)
  const COL={period:"#e85a8a",phase:"#4db6ac",ov:"#9b59b6"};
  function segType(i){
    if(i>=13&&i<=15)return"ov";
    if(i<L)return"period";
    return"phase";
  }
  const areaPoly=X(0)+","+Y(0)+" "+pts.map(pt=>X(pt.i)+","+Y(pt.p)).join(" ")+" "+X(N-1)+","+Y(0);

  }

  let todayMark="";
  if(todayP!=null){const tp=todayP.toFixed(1);const tx=X(todayIdx),ty=Y(todayP);todayMark='<circle cx="'+tx+'" cy="'+ty+'" r="4" fill="#6c7cf2" stroke="#fff" stroke-width="1.5"/><text x="'+tx+'" y="'+(ty+16)+'" font-size="10" fill="#5a64d8" text-anchor="middle">今日怀孕几率<tspan x="'+tx+'" dy="14" font-size="12" font-weight="bold">'+tp+'%</tspan></text>';}
  const svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">'+grid+xlab
    +'<polygon points="'+areaPoly+'" fill="rgba(108,124,242,0.08)"/>'
    +segs+ov+todayMark+'</svg>';
  const leg='<div class="fert-legend"><span><i style="background:#e85a8a"></i>月经期</span><span><i style="background:#4db6ac"></i>卵泡期/黄体期</span><span><i style="background:#9b59b6"></i>排卵期</span></div>';

  return '<div class="card" id="pd-fert-card"><h3>🤰 怀孕几率</h3>'+svg+leg+'<div class="muted" style="font-size:13px;margin-top:6px">'+note+'</div></div>';
}

function pdInPeriod(ds){
  const P=getPD();
  for(const p of P.periods){
    if(p.end){if(ds>=p.start&&ds<=p.end)return p;}
    else{
      const lim=fmtDate(new Date(Math.min(Date.now(),new Date(p.start+"T00:00:00").getTime()+6*864e5)));
      if(ds>=p.start&&ds<=lim)return p;
    }
  }
  return null;
}
function pdIsPredicted(ds){
  const P=getPD();
  if(!P.periods.length)return false;
  const starts=P.periods.map(p=>p.start).sort();
  const last=new Date(starts[starts.length-1]+"T00:00:00");
  const d=new Date(ds+"T00:00:00");
  const diff=Math.round((d-last)/864e5);
  if(diff<28)return false;
  const lens=P.periods.filter(p=>p.end).map(p=>Math.round((new Date(p.end+"T00:00:00")-new Date(p.start+"T00:00:00"))/864e5)+1);
  const avgLen=lens.length?lens.reduce((a,b)=>a+b,0)/lens.length:5;
  const r=((diff%28)+28)%28;
  return r<avgLen;
}
function pdPeriodBoundary(ds){
  const P=getPD();
  for(const p of P.periods){
    if(p.start===ds)return"start";
    if(p.end&&p.end===ds)return"end";
  }
  return null;
}
function pdDayType(ds){
  if(pdInPeriod(ds))return"p-real";
  if(pdIsPredicted(ds))return"p-period";
  const P=getPD();
  if(!P.periods.length)return"";
  const starts=P.periods.map(p=>p.start).sort();
  const last=new Date(starts[starts.length-1]+"T00:00:00");
  const d=new Date(ds+"T00:00:00");
  const diff=Math.round((d-last)/864e5);
  const cyc=28;
  const dayN=((diff%cyc)+cyc)%cyc; // 0-based cycle day
  if(dayN>=9&&dayN<=18)return"p-danger";
  return"p-safe";
}

function openCalc(initVal,onDone){
  let expr=initVal&&!isNaN(initVal)?String(initVal):"";
  openModal("计算金额",
    '<div class="calc-display" id="cc-disp">0</div><div class="calc-grid">'
    +["7","8","9","÷","4","5","6","×","1","2","3","-","0",".","←","+"].map(k=>'<button data-k="'+k+'"'+("÷×-+←".includes(k)?' class="op"':"")+'>'+k+'</button>').join("")
    +'<button class="op" data-k="C">C</button><button data-k="%">%</button><button class="eq" data-k="=">确定 =</button></div>',
    (m,close)=>{
      const disp=m.querySelector("#cc-disp");
      function upd(){disp.textContent=expr||"0";}
      function calc(){
        const raw=expr.trim();
        if(!raw)return null;
        // 归一化：÷×→*/、百分比作后缀、前导小数点、尾随运算符
        let e=raw.replace(/×/g,"*").replace(/÷/g,"/").replace(/，/g,",").replace(/,/g,"");
        e=e.replace(/(\d+(?:\.\d+)?)%/g,"($1)/100");        // 50% -> 0.5
        e=e.replace(/(^|[+\-*/])\./g,(_,p)=>p+"0.");       // .5 -> 0.5
        e=e.replace(/[+*\/.\-]+$/,"");                      // 去掉尾随运算符/小数点
        if(e && /^[\d+\-*/.() ]+$/.test(e)){
          try{
            const r=arithEval(e);                            // 纯 JS 求值，不依赖 eval/Function（沙箱禁用）
            if(typeof r==="number"&&isFinite(r))return Math.round(r*100)/100;
          }catch(e2){}
        }
        // 兜底：容忍多余符号，直接按数值解析
        const n=parseFloat(raw.replace(/[^0-9.\-]/g,""));
        return isFinite(n)?Math.round(n*100)/100:null;
      }
      function arithEval(s){
        let i=0;
        const skip=()=>{while(s[i]===" "||s[i]==="\t")i++;};
        const primary=()=>{
          skip();
          if(s[i]==="("){i++;const v=exprP();skip();if(s[i]===")")i++;return v;}
          let num="";while(s[i]!==undefined&&/[\d.]/.test(s[i]))num+=s[i++];
          if(num==="")throw new Error("bad number");
          return parseFloat(num);
        };
        const factor=()=>{skip();let sign=1;while(s[i]==="+"||s[i]==="-"){if(s[i]==="-")sign=-sign;i++;}return sign*primary();};
        const term=()=>{skip();let v=factor();skip();while(s[i]==="*"||s[i]==="/"){const op=s[i++];const r=factor();v=op==="*"?v*r:v/r;skip();}return v;};
        const exprP=()=>{skip();let v=term();skip();while(s[i]==="+"||s[i]==="-"){const op=s[i++];const r=term();v=op==="+"?v+r:v-r;skip();}return v;};
        const r=exprP();
        if(i<s.length)throw new Error("trailing chars");
        return r;
      }
      m.querySelectorAll("[data-k]").forEach(btn=>btn.onclick=()=>{
        const k=btn.dataset.k;
        if(k==="C")expr="";
        else if(k==="←")expr=expr.slice(0,-1);
        else if(k==="="){
          if(!expr.trim()){close();return;}                  // 空表达式直接关闭，不报错
          const r=calc();
          if(r==null){toast("无法计算该表达式，请检查后重试");return;}
          onDone(String(r));close();return;
        }
        else expr+=k;
        upd();
      });
      upd();
    });
}

/* ================= 8. 碎碎念 ================= */
const MEMO_KEY="fll_memos";
function renderMemo(){
  const memos=store.get(MEMO_KEY,[]).slice().sort((a,b)=>b.ts-a.ts);
  const td=todayStr();
  const page=document.getElementById("page-memo");
  page.innerHTML='<div class="page-title">📝 碎碎念</div><div class="page-date">'+cnDate(td)+' '+weekCn(td)+'</div>'
  +'<div class="card"><textarea class="note-input" id="memo-input" placeholder="今天有什么想说的？写下来吧～"></textarea>'
  +'<div style="text-align:right;margin-top:12px"><button class="btn" onclick="App.memoSave()">💾 保存碎碎念</button></div></div>'
  +'<div class="card"><h3>历史碎碎念</h3>'
  +(memos.length?memos.map(n=>'<div class="note-item"><div class="nd"><span>'+cnDate(n.date)+' '+n.time+'</span><button class="icon-btn" onclick="App.memoDel(\''+n.id+'\')">🗑</button></div><div class="nt">'+esc(n.text)+'</div></div>').join(""):'<div class="empty">还没有碎碎念记录</div>')+'</div>';
}
App.memoSave=()=>{
  const inp=document.getElementById("memo-input");
  const v=inp.value.trim();
  if(!v){toast("先写点什么吧～");return;}
  const memos=store.get(MEMO_KEY,[]);
  memos.push({id:uid(),date:todayStr(),time:nowTime(),text:v,ts:Date.now()});
  store.set(MEMO_KEY,memos);renderMemo();
};
App.memoDel=id=>{confirmModal("确定删除这条碎碎念吗？",true).then(ok=>{if(!ok)return;store.set(MEMO_KEY,store.get(MEMO_KEY,[]).filter(n=>n.id!==id));renderMemo();});};

/* ================= 导航与初始化 ================= */
const RENDERERS={plan:renderPlan,pet:renderPet,fit:renderFit,diet:renderDiet,weight:renderWeight,period:renderPeriod,ledger:renderLedger,memo:renderMemo};
function goPage(pg){
  document.querySelectorAll(".nav-item").forEach(i=>i.classList.toggle("active",i.dataset.page===pg));
  document.querySelectorAll(".bt-item").forEach(i=>i.classList.toggle("active",i.dataset.page===pg));
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  const el=document.getElementById("page-"+pg);
  if(el)el.classList.add("active");
  if(RENDERERS[pg])RENDERERS[pg]();
  if(window.scrollTo)window.scrollTo(0,0);
}
document.querySelectorAll(".nav-item").forEach(item=>item.onclick=()=>goPage(item.dataset.page));
document.querySelectorAll(".bt-item").forEach(item=>item.onclick=()=>goPage(item.dataset.page));
goPage("plan");
window.App=App;

/* ================= PWA：Service Worker 注册 + 安装引导 ================= */
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}
let deferredPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{
  e.preventDefault();deferredPrompt=e;
  const tip=document.getElementById("install-tip");
  const body=document.getElementById("install-body");
  const isIOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  if(isIOS){
    body.innerHTML='本机为 iOS，请点击 Safari 底部「<b>分享</b>」按钮 ➜ 选择「<b>添加到主屏幕</b>」，即可把工作台变成独立 App。';
  }else{
    body.innerHTML='点击下方「<b>安装</b>」，即可把工作台添加到主屏幕，像原生 App 一样全屏使用、可离线打开。';
  }
  if(tip)tip.style.display="flex";
});
document.getElementById("install-close").onclick=()=>{document.getElementById("install-tip").style.display="none";};
document.getElementById("install-go").onclick=()=>{
  const tip=document.getElementById("install-tip");
  if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.finally(()=>{deferredPrompt=null;if(tip)tip.style.display="none";});}
  else if(tip)tip.style.display="none";
};
</script>
